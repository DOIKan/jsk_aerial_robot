aerial_robot_control_name: aerial_robot_control/uuv_d_controller

controller:
  xy:
    p_gain: 8.0
    i_gain: 1.0
    d_gain: 5.0
    limit_sum: 4.0
    limit_p: 20.0
    limit_i: 20.0
    limit_d: 20.0

  z:
    p_gain: 8.0
    i_gain: 1.0
    d_gain: 5.0
    limit_err_p: 20.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5
  
  roll_pitch:
    p_gain: 2.0
    i_gain: 0.0
    d_gain: 0.2
    limit_sum: 50.0
    limit_p: 50.0
    limit_i: 50.0
    limit_d: 50.0

    start_rp_integration_height: 0.3


  yaw:
    p_gain: 8.0
    i_gain: 2.0
    d_gain: 0.1
    limit_err_p: 20
    limit_sum: 20.0
    limit_p: 30
    limit_i: 20.0
    limit_d: 20.0

    need_d_control: true

